name: Deploy a cPanel (dev/preprod)

# main -> dev.fabrica.micomercio.co
# pre  -> preprod.fabrica.micomercio.co
# pre -> prod sigue siendo 100% manual, esto no lo toca.

on:
  push:
    branches:
      - main
      - pre

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm ci y prisma generate corren ACA (runner de GitHub, sin límite de
      # procesos ni de memoria) — nunca en el cPanel compartido. Ver gotcha
      # E.4 y E.7 de GUIA_INSTALACION_FABRICA.md.
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Elegir carpeta destino según la rama
        id: ambiente
        run: |
          if [ "${{ github.ref_name }}" = "pre" ]; then
            echo "target=${{ vars.CPANEL_PATH_PREPROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ vars.CPANEL_PATH_DEV }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via rsync
        uses: easingthemes/ssh-deploy@v5.0.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ vars.CPANEL_SSH_HOST }}
          REMOTE_PORT: ${{ vars.CPANEL_SSH_PORT }}
          REMOTE_USER: ${{ vars.CPANEL_SSH_USER }}
          SOURCE: './'
          TARGET: ${{ steps.ambiente.outputs.target }}
          # node_modules SI se sube (ya viene armado del paso de arriba) —
          # a proposito no se usa --exclude-from=.gitignore, porque eso
          # excluiria justo lo que queremos subir.
          # .htaccess, tmp/ y stderr.log son del servidor, no del repo:
          # excluirlos evita que --delete los borre (gotcha E.5).
          ARGS: '-avz --delete'
          EXCLUDE: '.git/, .github/, .htaccess, tmp/, stderr.log, .env'
          SCRIPT_AFTER: |
            cd ${{ steps.ambiente.outputs.target }}
            mkdir -p tmp
            touch tmp/restart.txt
