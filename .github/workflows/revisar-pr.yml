name: Revisar PR abierto por Routine

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  revisar_pr:
    if: startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: micomercio
          POSTGRES_PASSWORD: micomercio_local_dev
          POSTGRES_DB: micomercio_local
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U micomercio -d micomercio_local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://micomercio:micomercio_local_dev@localhost:5433/micomercio_local?schema=public
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Traer el diff del PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} > pr-diff.txt
          echo "Líneas del diff: $(wc -l < pr-diff.txt)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Correr la suite de tests del proyecto (Capa 1, con Postgres real vía service container)
        id: tests
        continue-on-error: true
        run: |
          npm ci
          npx prisma generate
          # Service container arranca vacío, sin migraciones versionadas (ver
          # CLAUDE.md/DOCUMENTACION_TECNICA.md) — db push sincroniza el schema
          # directo desde prisma/schema.prisma, sin necesitar migraciones.
          npx prisma db push --skip-generate
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)" 2>/dev/null; then
            npm test > test-output.txt 2>&1
            echo "resultado=$?" >> "$GITHUB_OUTPUT"
          else
            echo "Este proyecto todavía no tiene un script \"test\" configurado en package.json." > test-output.txt
            echo "resultado=sin_tests" >> "$GITHUB_OUTPUT"
          fi
          cat test-output.txt

      - name: 🔍 Revisión con subagentes
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          settings: |
            {
              "permissions": {
                "allow": ["Bash(gh pr comment *)", "Bash(curl *)", "Write"]
              }
            }
          prompt: |
            Estás revisando el PR #${{ github.event.pull_request.number }} del repo
            `${{ github.repository }}`, rama `${{ github.head_ref }}` contra `main`,
            título: "${{ github.event.pull_request.title }}". Este PR tiene
            ${{ github.event.pull_request.commits }} commit(s) hasta ahora.

            El diff completo de este PR ya está escrito en el archivo pr-diff.txt en
            la raíz de este mismo checkout (ruta relativa al repo, NO en /tmp — fuera
            del checkout no tienes permiso de lectura automático) — léelo con la
            herramienta Read antes de continuar. NO ejecutes `gh pr diff`, `git diff`
            ni ningún otro comando para volver a obtenerlo, ya lo tienes.

            El resultado REAL de correr la suite de tests del proyecto (si tiene una
            configurada) ya está en test-output.txt, en la raíz de este checkout —
            léelo también. El resultado del step se llama "tests", su output
            "resultado" vale "sin_tests" (el proyecto no tiene script de test
            todavía, no es un fallo), "0" (todos los tests pasaron), o cualquier otro
            número (al menos un test falló — REAL/CRÍTICO automático, sin necesidad
            de que vos lo evalúes: un test que falla es un hecho objetivo, no una
            opinión).

            Corre estos tres subagentes de proyecto sobre ese diff, usando la
            herramienta Task con el `subagent_type` exacto (ya están definidos en
            .claude/agents/ de este repo, invócalos directamente):

            1. `revisor-codigo` — revisión de calidad del diff, incluyendo el
               resultado real de test-output.txt como evidencia.
            2. `validador-metricas` — solo si el diff toca dashboard.service.js o
               cambia algún cálculo/query; si es puramente frontend, igual invócalo
               pero dile que confirme que no aplica en vez de omitirlo.
            3. `documentador` — para confirmar si DOCUMENTACION_TECNICA.md necesita
               actualizarse (dile explícitamente que NO aplique ningún cambio, solo
               diagnostique).

            NO invoques `tester` acá — necesita el servidor completo corriendo, no
            solo la base de datos. Esa verificación es otra capa aparte, pendiente de
            conectar post-deploy (Parte E).

            IMPORTANTE sobre los límites reales de este entorno: este job SÍ tiene
            una base de datos Postgres real disponible (`DATABASE_URL` ya apunta a
            ella, con el schema ya sincronizado vía `prisma db push` antes de correr
            los tests) — por eso el step de tests de arriba puede ejecutar queries
            reales. Lo que NO tiene es el servidor Express corriendo ni datos
            preexistentes más allá del schema vacío — así que un test que dependa de
            filas específicas ya cargadas, o de pegarle a un endpoint HTTP real, va a
            fallar acá por eso, no por un bug de código; si ves ese patrón en
            test-output.txt, señalalo como limitación del entorno de este job, no
            como hallazgo de calidad. Fuera de eso, tu fuente de verdad es
            pr-diff.txt y test-output.txt — no inventes resultados que no estén ahí.

            IMPORTANTE sobre cómo invocar cada subagente: este es un job de GitHub
            Actions de un solo turno, sin sesión interactiva después — NO existe un
            "más tarde" en el que puedas continuar. Invoca cada subagente de forma
            SÍNCRONA/bloqueante (NO en segundo plano, NO como tarea async) y espera
            su resultado completo antes de seguir con el siguiente.

            Antes de escribir el comentario, decidí cuál de estos 3 casos aplica —
            porque en uno de ellos el comentario necesita una marca especial:

            - **Caso A** — NO hay ningún hallazgo REAL/CRÍTICO (solo cosméticos,
              informativos, o ninguno).
            - **Caso B** — SÍ hay al menos un hallazgo REAL/CRÍTICO, pero este PR ya
              tiene más de 1 commit (${{ github.event.pull_request.commits }} > 1, es
              decir ya se corrigió automáticamente antes) → ya se usó el único intento
              automático permitido en este workflow.
            - **Caso C** — SÍ hay al menos un hallazgo REAL/CRÍTICO Y este PR tiene
              exactamente 1 commit (nunca se corrigió automáticamente antes).

            Escribe UN solo comentario consolidado (más severo primero, con secciones
            claras por subagente, marcando explícitamente cada hallazgo como
            REAL/CRÍTICO o COSMÉTICO/INFORMATIVO) a un archivo temporal con Write. Si
            el caso es **B**, agregá al final del comentario, en su propia línea, EXACTAMENTE
            este texto (sin modificarlo, es una marca que otro sistema busca de forma
            literal):

            ```
            🧭 ESPERANDO_DECISION: hay hallazgos reales sin corregir y ya se usó el intento automático de corrección.
            ```

            Publicá el comentario con:

            ```
            gh pr comment ${{ github.event.pull_request.number }} --body-file <ruta-del-archivo>
            ```

            Después de publicar el comentario, actuá según el caso:

            - **Caso A** → no hagas nada más, terminaste.
            - **Caso B** → no dispares ninguna corrección — el comentario ya lleva la
              marca de arriba, que otro sistema (el Coordinador) va a leer para decidir
              si vale la pena un ajuste más. Terminaste.
            - **Caso C** → disparás la Routine de corrección UNA sola vez, ejecutando
              exactamente:

              ```
              curl -X POST "https://api.anthropic.com/v1/claude_code/routines/${{ vars.ROUTINE_CORREGIR_ID }}/fire" \
                -H "Authorization: Bearer $FIX_PR_ROUTINE_API_TOKEN" \
                -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
                -H "anthropic-version: 2023-06-01" \
                -H "Content-Type: application/json" \
                -d "{\"text\": \"PR #${{ github.event.pull_request.number }} tiene hallazgos reales de revisión pendientes de corregir, ver el comentario de revisión más reciente en el PR.\"}"
              ```

            `curl` y `gh pr comment` son los únicos comandos de Bash autorizados en
            este entorno — cualquier otro quedará bloqueado, no lo intentes. La tarea
            no está completa hasta que el comentario de revisión quede publicado (y,
            si aplica según la regla de arriba, la corrección disparada).

            CRÍTICO: ejecutá `gh pr comment` **exactamente una sola vez, con el
            comentario consolidado completo ya terminado**. No lo uses para probar, ni
            para publicar un borrador corto antes del definitivo — cada ejecución
            publica un comentario real y visible en el PR, no hay forma de "probar en
            seco". Si el comentario es largo, igual va completo en un solo
            `--body-file`, nunca partido en varias llamadas.

            NO escribas código, NO corrijas nada tú mismo, NO abras otra rama ni PR —
            tu única salida es el comentario de revisión y, cuando corresponda, el
            disparo de la Routine de corrección.

            ÚLTIMO PASO OBLIGATORIO, antes de terminar tu turno: este job de GitHub
            Actions termina apenas vos terminás de responder — no hay ninguna otra
            oportunidad de arreglarlo después, ni un humano revisando que lo hiciste
            bien antes de que el job se marque "success". Un job que termina
            "success" sin haber publicado el comentario (o sin haber disparado la
            Routine cuando correspondía) es un fallo silencioso — nadie se entera,
            porque GitHub solo ve que el proceso no crasheó. Por eso, literalmente en
            tu último mensaje, confirmate a vos mismo con una lista explícita antes de
            escribir tu respuesta final:
            - ¿Ejecuté `gh pr comment` con el comentario consolidado completo? Si la
              respuesta es "no" o "no estoy seguro" — ejecutalo ahora, no lo des por
              hecho ni lo menciones como algo que "ibas a hacer".
            - Si es Caso C, ¿ejecuté el `curl` de disparo? Mismo criterio: si no
              estás seguro de haberlo corrido, correlo ahora antes de responder.
        env:
          FIX_PR_ROUTINE_API_TOKEN: ${{ secrets.FIX_PR_ROUTINE_API_TOKEN }}
